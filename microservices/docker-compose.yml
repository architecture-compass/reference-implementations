# Run one language at a time:
#   docker compose --profile java up --build
# Profiles: java, python, go, rust, dotnet, node

x-orders: &orders
  environment:
    PORT: "8080"
    DATABASE_URL: postgres://app:app@postgres:5432/orders
    KAFKA_BROKERS: kafka:9092
    CATALOG_URL: http://catalog
  ports: ["8081:8080"]
  depends_on: &deps
    postgres: { condition: service_healthy }
    kafka-init: { condition: service_completed_successfully }
    catalog: { condition: service_started }

x-payments: &payments
  environment:
    PORT: "8080"
    DATABASE_URL: postgres://app:app@postgres:5432/payments
    KAFKA_BROKERS: kafka:9092
  ports: ["8082:8080"]
  depends_on: *deps

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d payments"]
      interval: 2s
      retries: 30

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 3s
      retries: 40

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in orders.order-placed payments.payment-captured; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done

  catalog:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/catalog/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/catalog/prices:/usr/share/catalog/prices:ro
    ports: ["8083:80"]

  # ---------- Java (Spring Boot) ----------
  orders-java:
    <<: *orders
    build: ./java/orders
    profiles: [java]
  payments-java:
    <<: *payments
    build: ./java/payments
    profiles: [java]

  # ---------- Python (FastAPI) ----------
  orders-python:
    <<: *orders
    build: ./python/orders
    profiles: [python]
  payments-python:
    <<: *payments
    build: ./python/payments
    profiles: [python]

  # ---------- Go ----------
  orders-go:
    <<: *orders
    build: ./go/orders
    profiles: [go]
  payments-go:
    <<: *payments
    build: ./go/payments
    profiles: [go]

  # ---------- Rust ----------
  orders-rust:
    <<: *orders
    build: ./rust/orders
    profiles: [rust]
  payments-rust:
    <<: *payments
    build: ./rust/payments
    profiles: [rust]

  # ---------- C# (.NET) ----------
  orders-dotnet:
    <<: *orders
    build: ./dotnet/Orders
    profiles: [dotnet]
  payments-dotnet:
    <<: *payments
    build: ./dotnet/Payments
    profiles: [dotnet]

  # ---------- TypeScript (Node.js) ----------
  orders-node:
    <<: *orders
    build: ./node/orders
    profiles: [node]
  payments-node:
    <<: *payments
    build: ./node/payments
    profiles: [node]
