server:
  port: ${PORT:8080}

spring:
  application:
    name: payments
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record   # commit each offset only after the listener returns

logging:
  level:
    org.apache.kafka: warn
