# Iceberg catalog "lake": REST catalog for metadata, S3-compatible storage for data.
spark.sql.extensions                         org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                  rest
spark.sql.catalog.lake.uri                   http://iceberg-rest:8181
spark.sql.catalog.lake.warehouse             s3://lake/
spark.sql.catalog.lake.io-impl               org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint           http://seaweedfs:8333
spark.sql.catalog.lake.s3.path-style-access  true
spark.sql.defaultCatalog                     lake

spark.sql.session.timeZone                   UTC
spark.sql.shuffle.partitions                 4
spark.driver.memory                          1536m
spark.ui.enabled                             false
# Always load the latest table version, so each step sees the previous step's commit.
spark.sql.catalog.lake.cache-enabled         false
