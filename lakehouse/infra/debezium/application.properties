# Debezium Server: streams every change to the orders table into Kafka.
debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=kafka:9092
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer

debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=postgres
debezium.source.database.dbname=shop
debezium.source.plugin.name=pgoutput
debezium.source.publication.autocreate.mode=filtered
# Topic: shop.public.orders
debezium.source.topic.prefix=shop
debezium.source.table.include.list=public.orders
# Decimals as strings ("45.50") so no precision is lost on the way.
debezium.source.decimal.handling.mode=string
# A delete is one event with op=d; no extra null "tombstone" message.
debezium.source.tombstones.on.delete=false

# Plain JSON envelopes: {"before":…, "after":…, "op":"u", "source":{…}, "ts_ms":…}
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false
